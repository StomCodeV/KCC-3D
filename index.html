 dusk:{sun:dir(230,5),sk:dir(215,-2.5),sc:0xff8a55,si:.6,hs:0x3a5a9a,hg:0x101820,hi:.5,ac:0x2a3a60,ai:.3,fog:0x3a4f78,fd:.0014,ex:1.1,env:.3,sky:[3,2.2,.01],lit:1.3,cl:[0x6a7aa8,.55]},
 night:{sun:[-80,140,-60],sk:dir(150,-8),sc:0x4466aa,si:.3,hs:0x1a2540,hg:0x0a0e1a,hi:.12,ac:0x0a1020,ai:.15,fog:0x0a0e1a,fd:.0025,ex:.85,env:.1,sky:[2,.15,.005],lit:1.8,cl:[0x151c2e,.5]}};
let lit=0,ledMode=0;
function setMode(k){const m=MODES[k];lit=m.lit;
 sun.color.setHex(m.sc);sun.intensity=m.si;sun.position.set(...m.sun).normalize().multiplyScalar(260);
 hemi.color.setHex(m.hs);hemi.groundColor.setHex(m.hg);hemi.intensity=m.hi;amb.color.setHex(m.ac);amb.intensity=m.ai;
 scene.fog.color.setHex(m.fog);scene.fog.density=m.fd;renderer.toneMappingExposure=m.ex;mats.forEach(x=>x.envMapIntensity=x.userData.e*m.env);
 su.turbidity.value=m.sky[0];su.rayleigh.value=m.sky[1];su.mieCoefficient.value=m.sky[2];su.sunPosition.value.set(...(m.sk||m.sun)).normalize();
 cloudM.color.setHex(m.cl[0]);cloudM.opacity=m.cl[1];
 lamps.forEach(l=>l.visible=!!lit);domeLight.intensity=lit?3500:0;ledgeM.emissiveIntensity=lit?.5:0;
 for(const g of[podM,baseM,winMat])g.emissiveIntensity=lit?1.3:0;
 document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==k))}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
// ── LED FACADE ──
const BL=new THREE.Color(0x1e8cff),YE=new THREE.Color(0xffb81c),GR=new THREE.Color(0x2bd04f),BAND=[GR,GR,GR,YE,YE,YE,BL,BL,BL],CY=[GR,YE,BL],tmp=new THREE.Color();
function led(now){const T=now/1000%6;
 tierM.forEach((m,i)=>{if(!ledMode)tmp.copy(BAND[i]);else if(T<4.5)tmp.copy([BL,YE,GR][T/1.5|0]);else{const w=(((i/9*3-(T-4.5)*2)%3)+3)%3,f=w|0;tmp.copy(CY[f]).lerp(CY[(f+1)%3],w-f)}
  m.emissive.copy(tmp);m.emissiveIntensity=lit*(1+.07*Math.sin(now/600+i))});
 domeLight.color.copy(tierM[4].emissive)}
$('led').onclick=e=>{ledMode^=1;e.target.textContent='LED: '+(ledMode?'Cycle':'Flag')};
// ── CAMERA PRESETS ──
const CAMS={'Front Approach':[[0,22,150],[0,22,0]],'Photo Match (Dusk)':[[-62,6,128],[-22,22,0]],'Dome Close-up':[[50,38,62],[0,28,0]],'Full Complex':[[170,100,200],[-10,22,0]],'Hotel Side':[[-190,40,125],[-105,14,28]],'Rear':[[0,30,-160],[0,22,0]],'Aerial':[[0,230,210],[0,0,0]],'Low Angle':[[60,5,95],[0,36,0]],'Night Hero':[[105,30,95],[0,28,0]]};
let tw=null;
const go=n=>{const[p,t]=CAMS[n];tw={t0:performance.now(),p0:camera.position.clone(),q0:controls.target.clone(),p1:V(...p),q1:V(...t)}};
$('cam').innerHTML=Object.keys(CAMS).map(n=>`<option>${n}</option>`).join('');$('cam').value='Front Approach';
$('cam').onchange=e=>{const v=e.target.value;go(v);if(v=='Night Hero')setMode('night');if(v.startsWith('Photo'))setMode('dusk')};
$('rot').onchange=e=>controls.autoRotate=e.target.checked;
camera.position.set(...CAMS['Front Approach'][0]);controls.target.set(...CAMS['Front Approach'][1]);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setMode('day');led(0);await pg(100,'Ready');
renderer.setAnimationLoop(()=>{const now=performance.now();
 if(tw){let k=Math.min(1,(now-tw.t0)/1200);k=k<.5?4*k*k*k:1-(-2*k+2)**3/2;camera.position.lerpVectors(tw.p0,tw.p1,k);controls.target.lerpVectors(tw.q0,tw.q1,k);if(k>=1)tw=null}
 if(lit)led(now);cloudT.offset.x+=.00003;controls.update();renderer.render(scene,camera)});
setTimeout(()=>$('load').classList.add('h'),400);
</script></body></html>
